name: Sync active public repository activity

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - ".github/workflows/portfolio-activity-sync.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: portfolio-activity-sync
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Check out portfolio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build active public repository feed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import datetime, timedelta, timezone

          owner = "ReignnRule11"
          cutoff = datetime.now(timezone.utc) - timedelta(days=30)
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "portfolio-activity-sync",
          }

          repositories = []
          page = 1
          while True:
              query = urllib.parse.urlencode({
                  "type": "public",
                  "sort": "pushed",
                  "direction": "desc",
                  "per_page": 100,
                  "page": page,
              })
              request = urllib.request.Request(
                  f"https://api.github.com/users/{owner}/repos?{query}",
                  headers=headers,
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      batch = json.loads(response.read().decode("utf-8"))
              except urllib.error.HTTPError as error:
                  raise SystemExit(f"GitHub API request failed ({error.code}): {error.read().decode('utf-8', 'replace')}")
              if not batch:
                  break

              for repo in batch:
                  if repo.get("fork") or repo.get("archived") or repo.get("disabled"):
                      continue
                  if repo.get("name", "").lower() == "portfolio":
                      continue
                  pushed_at = repo.get("pushed_at")
                  if not pushed_at:
                      continue
                  pushed = datetime.fromisoformat(pushed_at.replace("Z", "+00:00"))
                  if pushed < cutoff:
                      continue
                  repositories.append({
                      "name": repo.get("name"),
                      "full_name": repo.get("full_name"),
                      "html_url": repo.get("html_url"),
                      "description": repo.get("description"),
                      "language": repo.get("language"),
                      "pushed_at": pushed_at,
                      "default_branch": repo.get("default_branch"),
                  })
              if len(batch) < 100:
                  break
              page += 1

          repositories.sort(key=lambda item: item["pushed_at"], reverse=True)
          feed = {
              "window_days": 30,
              "visibility": "public-only",
              "projects": repositories,
          }
          os.makedirs("data", exist_ok=True)
          with open("data/active-projects.json", "w", encoding="utf-8") as output:
              json.dump(feed, output, ensure_ascii=False, indent=2)
              output.write("\n")
          print(f"Found {len(repositories)} public repositories with pushes in the last 30 days.")
          PY

      - name: Commit feed when activity changes
        id: commit
        run: |
          if git diff --quiet -- data/active-projects.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No activity-feed changes; deployment is unnecessary."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/active-projects.json
            git commit -m "chore: refresh active repository feed"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Upload portfolio site
        if: steps.commit.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy updated portfolio
        id: deployment
        if: steps.commit.outputs.changed == 'true'
        uses: actions/deploy-pages@v4
